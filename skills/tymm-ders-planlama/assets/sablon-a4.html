<!DOCTYPE html>
<!--
  TYMM Ders Planlama — A4 şablon
  Bu dosya üç çıktının da (ders-plani / calisma-kagidi / ogrenme-kanitlari)
  temelidir. Beceri, içerik bloklarını doldurur; stil ve sayfa kuralları
  bağlayıcıdır. Blok işaretleri: [[...]]
-->
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>[[BELGE_BASLIGI]]</title>
<style>
  :root{
    --murekkep:#1a1a2e; --vurgu:#0f4c81; --acik:#e8f0f7;
    --cizgi:#c9d4de; --puan:#0f4c81; --uyari:#8a3b12;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  @page{size:A4; margin:14mm 12mm;}
  html,body{font-family:'Segoe UI',Calibri,Arial,sans-serif;
    color:var(--murekkep); font-size:10.5pt; line-height:1.45;}
  @media screen{
    body{background:#666; padding:20px;}
    .sayfa{width:210mm; min-height:297mm; margin:0 auto 20px;
      background:#fff; padding:14mm 12mm; box-shadow:0 2px 8px rgba(0,0,0,.3);}
  }
  @media print{
    .sayfa{page-break-after:always;}
    .sayfa:last-child{page-break-after:auto;}
  }

  /* Başlık şeridi — her belgenin ilk sayfası */
  .ust-serit{display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px solid var(--vurgu); padding-bottom:6px; margin-bottom:10px;}
  .ust-serit h1{font-size:15pt; color:var(--vurgu);}
  .ust-serit .meta{font-size:9pt; text-align:right; color:#444;}

  /* Kimlik tablosu (ders planı) */
  table.kimlik{width:100%; border-collapse:collapse; margin:8px 0 14px;}
  table.kimlik th{background:var(--acik); text-align:left; width:32mm;
    font-size:9pt; text-transform:uppercase; letter-spacing:.03em;}
  table.kimlik th, table.kimlik td{border:1px solid var(--cizgi);
    padding:4px 8px; vertical-align:top;}

  /* Bölüm başlıkları */
  h2.bolum{background:var(--vurgu); color:#fff; font-size:11pt;
    padding:4px 10px; margin:14px 0 8px; border-radius:3px;
    page-break-after:avoid;}
  h3{font-size:10.5pt; color:var(--vurgu); margin:10px 0 4px;}

  /* Senaryo kutusu (çalışma kağıdı) */
  .senaryo{border:2px solid var(--vurgu); background:var(--acik);
    border-radius:6px; padding:10px 14px; margin:10px 0;
    page-break-inside:avoid;}
  .senaryo .etiket{font-weight:700; color:var(--vurgu);
    font-size:9pt; text-transform:uppercase; letter-spacing:.05em;}

  /* Soru satırı + puan rozeti */
  .soru{margin:10px 0; page-break-inside:avoid;}
  .soru .no{font-weight:700; color:var(--vurgu);}
  .puan{float:right; font-size:9pt; font-weight:700; color:var(--puan);
    border:1.5px solid var(--puan); border-radius:10px; padding:1px 8px;}
  .cevap-alani{border-bottom:1px dotted #888; height:9mm;}
  .cevap-kutusu{border:1px solid var(--cizgi); border-radius:4px;
    min-height:22mm; margin-top:5px;}

  /* Öğrenci ad-soyad satırı */
  .ogrenci-satiri{display:flex; gap:16px; font-size:10pt; margin:6px 0 2px;}
  .ogrenci-satiri span{flex:1; border-bottom:1px solid var(--murekkep);
    padding-bottom:2px;}

  /* Zaman çizelgesi (ders planı akışı) */
  table.akis{width:100%; border-collapse:collapse; margin:6px 0;}
  table.akis th{background:var(--acik); font-size:9pt;}
  table.akis th, table.akis td{border:1px solid var(--cizgi);
    padding:4px 7px; vertical-align:top;}
  table.akis td.sure{width:16mm; text-align:center; font-weight:700;
    color:var(--vurgu); white-space:nowrap;}

  /* Yanılgı / kanıt tabloları */
  table.uclu{width:100%; border-collapse:collapse; margin:6px 0;}
  table.uclu th{background:#f4e9e1; color:var(--uyari); font-size:9pt;}
  table.uclu th, table.uclu td{border:1px solid var(--cizgi); padding:4px 7px;}

  /* Cevap anahtarı vurgusu */
  .anahtar td.dogru{font-weight:700; color:var(--vurgu);}

  .dipnot{font-size:8.5pt; color:#555; border-top:1px solid var(--cizgi);
    margin-top:12px; padding-top:4px;}
</style>
</head>
<body>

<!-- ======================= SAYFA İSKELETİ ============================
Her belge bir veya daha çok .sayfa bloğundan oluşur. Kurallar:
1. Cevap anahtarı DAİMA ayrı .sayfa bloğunda başlar (ogrenme-kanitlari).
2. .soru ve .senaryo blokları sayfa sonunda bölünmez (page-break-inside).
3. Puanlar .puan rozetiyle soru başlığının satırında gösterilir; belge
   toplamı 100'e kapanır ve son bölümün altında "Toplam: 100 puan" yazar.
4. Çalışma kağıdının ilk sayfasında .ogrenci-satiri (Ad Soyad / No / Sınıf)
   bulunur; ders planı ve kanıt sayfasında bulunmaz.
5. Ekran önizlemesi gri zemin üzerinde sayfa sayfa görünür; baskıda zemin
   ve gölge kaybolur (@media print).
===================================================================== -->

<div class="sayfa">
  <div class="ust-serit">
    <h1>[[BELGE_BASLIGI]]</h1>
    <div class="meta">[[SINIF_VE_TEMA]]<br>[[TARIH_VE_SURE]]</div>
  </div>

  [[ICERIK]]

  <div class="dipnot">[[DIPNOT — çıktı kodu · varsa doğrulama notu · sayfa üreticisi notu]]</div>
</div>

</body>
</html>
